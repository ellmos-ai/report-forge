[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "report-forge"
version = "1.1.5"
description = "Domain-neutral core engine for schema-bound, anonymizable report generation pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lukas Geiger", email = "lukas@um-bruch.org" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
keywords = ["report-generation", "docx", "anonymization", "pipeline", "schema-bound", "llm-ready"]
dependencies = [
    "python-docx>=1.2.0",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
formats = [
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "extract-msg>=0.45.0",
]
test = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/report-forge"
Repository = "https://github.com/ellmos-ai/report-forge"
Documentation = "https://github.com/ellmos-ai/report-forge#readme"
Issues = "https://github.com/ellmos-ai/report-forge/issues"
Changelog = "https://github.com/ellmos-ai/report-forge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["report_forge*"]

[tool.setuptools.package-data]
report_forge = ["data/*.json", "data/*.docx"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
