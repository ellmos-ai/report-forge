[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "report-forge"
version = "1.1.1"
description = "Domain-neutral core engine for schema-bound, anonymizable report generation pipelines"
readme = "README.md"
authors = [
    { name = "Lukas Geiger", email = "lukas@um-bruch.org" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
keywords = ["report-generation", "docx", "anonymization", "pipeline", "schema-bound", "llm-ready"]
dependencies = [
    "python-docx>=0.8.11",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/report-forge"
Repository = "https://github.com/ellmos-ai/report-forge"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
