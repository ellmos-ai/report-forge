name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
      - name: Build package artifacts
        run: python -m build --sdist --wheel --outdir dist
      - name: Install built distribution
        run: python -m pip install dist/*.whl
      - name: Verify dependency provenance
        run: |
          python -m pip check
          python -c "from importlib.metadata import version; print('report-forge', version('report-forge')); print('python-docx', version('python-docx')); print('jsonschema', version('jsonschema'))"
      - name: Installed import and CLI preflight
        run: |
          cd "$RUNNER_TEMP"
          python -m report_forge --info
          python -c "import report_forge; print(report_forge.__version__)"
      - name: Run tests
        run: |
          python -m pytest
