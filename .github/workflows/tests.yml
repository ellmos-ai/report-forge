name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest ruff
      - name: Code style check (ruff)
        run: ruff check .
      - name: Bytecode compilation check
        run: python -m compileall -q .
      - name: Build package artifacts
        run: python -m build --sdist --wheel --outdir dist
      - name: Install built distribution
        run: python -m pip install dist/*.whl
      - name: Verify dependency provenance
        run: |
          python -m pip check
          python -c "from importlib.metadata import version; print('report-forge', version('report-forge')); print('python-docx', version('python-docx')); print('jsonschema', version('jsonschema'))"
      - name: Installed import and CLI preflight
        run: |
          cd "$RUNNER_TEMP"
          python -m report_forge --info
          python -c "import report_forge; print(report_forge.__version__)"
      - name: Run tests
        run: |
          python -m pytest
